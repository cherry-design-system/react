name: Release
# Manual: bump the version in package.json, merge, then run this workflow.
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret. Configure the
# trusted publisher for @cherry-design-system/react on npmjs.com first.
# Provenance attestations need a public repository; while the repo is
# private, publish without --provenance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options: [next, latest]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: npm publish --access public --tag ${{ inputs.tag }}
