name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Generated files are committed
        run: git diff --exit-code -- src/index.ts src/style-api.json src/styles/tokens.css src/tokens 'src/components/**/variants.gen.ts'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract
      - run: pnpm build
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # axe (light/dark, 1280/320, every popup open), focus visibility,
      # focus traps, forced colors, reflow: see e2e/a11y.e2e.ts.
      - name: Accessibility checks
        run: pnpm test:a11y
