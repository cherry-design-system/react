name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Generated files are committed
        run: git diff --exit-code -- src/index.ts src/style-api.json src/styles/tokens.css src/tokens 'src/components/**/variants.gen.ts' skills/cherry-react/references
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract
      - run: pnpm build
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      # axe (light/dark, 1280/320, every popup open), focus visibility,
      # focus traps, forced colors, reflow: see e2e/a11y.e2e.ts.
      - name: Accessibility checks
        run: pnpm test:a11y

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A version bump is what triggers the release workflow, so the entry it
      # publishes as release notes has to land in the same change.
      - name: Require a changelog entry for a version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          base=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
          head=$(node -p "require('./package.json').version")

          if [ "$base" = "$head" ]; then
            echo "Version unchanged at $head"
            exit 0
          fi

          echo "Version bumped from $base to $head"
          node scripts/release-notes.mjs > /dev/null
          echo "CHANGELOG.md documents $head"
